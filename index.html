<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sport Event Map</title>
<meta name="description" content="Hierarchical drill-down map of sport events, from world view down to street level.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="assets/race-map.css">
<style>
  :root { --global-bg-color:#fff; --global-text-color:#222; --global-text-color-light:#666; --global-border-color:#e3e3e3; --global-link-color:#1f6fd1; }
  html[data-theme="dark"] { --global-bg-color:#1b1d21; --global-text-color:#e6e6e6; --global-text-color-light:#a0a4ab; --global-border-color:#3a3d43; --global-link-color:#7fb2ff; }
  body { margin:0; background:var(--global-bg-color); color:var(--global-text-color);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif; }
  a { color:var(--global-link-color); text-decoration:none; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 48px; }
  h1 { margin:0 0 .4em; font-size:1.8em; }
  .top { display:flex; justify-content:space-between; align-items:baseline; gap:1em; }
  .theme { background:none; border:1px solid var(--global-border-color); color:inherit; border-radius:999px; padding:.35em .6em; line-height:0; cursor:pointer; font:inherit; font-size:.85em; }
  footer { margin-top:2em; font-size:.8em; color:var(--global-text-color-light); }
</style>
<script>
  (function () { // theme: saved choice, else system setting
    var t; try { t = localStorage.getItem('theme'); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>
<main>
  <div class="top">
    <h1>Sport Event Map</h1>
    <button type="button" class="theme" id="theme" aria-label="Toggle dark mode" title="Light / dark"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
  </div>
  <div id="race-map" class="race-map" data-geo="assets/geo/"></div>
  <footer><a href="https://github.com/ZhiyunXu20/sport-event-map">Source on GitHub</a></footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
  document.getElementById('theme').onclick = function () {
    var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('theme', t); } catch (e) {}
  };
  // Load data/races.json if present (your own data, not in the repo), else the sample data.
  function get(u) { return fetch(u).then(function (r) { if (!r.ok) throw new Error(u); return r.text(); }); }
  Promise.all([
    get('data/races.json').catch(function () {
      var m = document.getElementById('race-map');
      m.setAttribute('data-intro-en', 'Sample data: a few well-known races, placed at approximate venues. Colour shows how many races each area holds; click to go one level deeper, down to a street map.');
      m.setAttribute('data-intro-zh', '示例数据：几场知名赛事，位置为大致场地。颜色表示各区域的赛事数量，点击逐级深入，直到街道地图。');
      return get('examples/races.sample.json');
    }),
    get('assets/i18n.json')
  ]).then(function (txt) {
    [['rm-races', txt[0]], ['rm-i18n', txt[1]]].forEach(function (p) {
      var s = document.createElement('script'); s.type = 'application/json'; s.id = p[0]; s.textContent = p[1];
      document.body.appendChild(s);
    });
    var js = document.createElement('script'); js.src = 'assets/race-map.js'; document.body.appendChild(js);
  }).catch(function (e) {
    document.getElementById('race-map').textContent = 'Could not load data (' + e.message + '). Serve this folder over HTTP, e.g. python3 -m http.server.';
  });
</script>
</body>
</html>
