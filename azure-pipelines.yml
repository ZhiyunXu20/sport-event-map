# Azure Pipelines: validate the data, test the tools, package the static site, deploy it.
#
#   Validate  ->  Test  ->  Build  ->  Deploy (main only, opt-in, behind the "production" environment)
#
# Pull requests run Validate, Test and Build, so a bad dataset or a failing test blocks the merge
# once a branch policy (or GitHub branch protection) requires this pipeline.
# Setup steps are in docs/azure-pipelines.md.

trigger:
  branches:
    include: [main]
  paths:
    exclude: ['README*.md', 'docs/*', 'LICENSE']

pr:
  branches:
    include: [main]

parameters:
  # 'hosted' = Microsoft-hosted Ubuntu agent (needs the free parallel-job grant).
  # 'selfhosted' = your own agent in the "Default" pool, e.g. a laptop; it must have python3 and node.
  - name: agentPool
    displayName: Agent
    type: string
    default: selfhosted
    values: [hosted, selfhosted]

variables:
  pythonVersion: '3.12'
  # Set DEPLOY_ENABLED=true (and the secret SWA_DEPLOYMENT_TOKEN) in the pipeline's Variables
  # to turn on the Deploy stage. Without them the pipeline is CI only.

stages:
  - stage: Validate
    displayName: Validate data and code
    jobs:
      - job: validate
        # Conditional pool must be set per job (not at the pipeline root).
        pool:
          ${{ if eq(parameters.agentPool, 'hosted') }}:
            vmImage: ubuntu-latest
          ${{ else }}:
            name: Default
        steps:
          - ${{ if eq(parameters.agentPool, 'hosted') }}:
              - task: UsePythonVersion@0
                inputs:
                  versionSpec: $(pythonVersion)
          - script: python3 -I tools/validate_races.py examples/races.sample.json
            displayName: Validate sample dataset
          - script: |
              set -e
              mkdir -p "$(Agent.TempDirectory)/filtered"
              python3 -I tools/publish_filter.py examples/races.sample.json tools/publish_rules.example.json "$(Agent.TempDirectory)/filtered/races.json"
              python3 -I tools/validate_races.py "$(Agent.TempDirectory)/filtered/races.json"
            displayName: Filter output is still a valid dataset
          - script: |
              set -e
              for f in assets/*.json assets/geo/*.json examples/*.json tools/*.json; do
                python3 -I -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f"
              done
              echo "All JSON files parse."
            displayName: JSON files parse
          - script: node --check assets/race-map.js
            displayName: JavaScript syntax check

  - stage: Test
    displayName: Unit tests
    dependsOn: Validate
    jobs:
      - job: pytest
        # Conditional pool must be set per job (not at the pipeline root).
        pool:
          ${{ if eq(parameters.agentPool, 'hosted') }}:
            vmImage: ubuntu-latest
          ${{ else }}:
            name: Default
        steps:
          - ${{ if eq(parameters.agentPool, 'hosted') }}:
              - task: UsePythonVersion@0
                inputs:
                  versionSpec: $(pythonVersion)
          - script: |
              set -e
              python3 -m venv "$(Agent.TempDirectory)/venv"
              . "$(Agent.TempDirectory)/venv/bin/activate"
              pip install -q -r requirements-dev.txt
              pytest --junitxml=test-results.xml --cov=tools --cov-report=xml:coverage.xml
            displayName: Run pytest
          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: test-results.xml
              testRunTitle: Data tools
          - task: PublishCodeCoverageResults@2
            displayName: Publish coverage
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: coverage.xml

  - stage: Build
    displayName: Package static site
    dependsOn: Test
    jobs:
      - job: package
        # Conditional pool must be set per job (not at the pipeline root).
        pool:
          ${{ if eq(parameters.agentPool, 'hosted') }}:
            vmImage: ubuntu-latest
          ${{ else }}:
            name: Default
        steps:
          - task: CopyFiles@2
            displayName: Copy site files
            inputs:
              Contents: |
                index.html
                .nojekyll
                LICENSE
                assets/**
                examples/**
              TargetFolder: $(Build.ArtifactStagingDirectory)/site
          - script: |
              cd "$(Build.ArtifactStagingDirectory)/site"
              echo "commit=$(Build.SourceVersion) build=$(Build.BuildNumber)" > version.txt
              find . -type f | sort
            displayName: Stamp version and list files
          - task: PublishPipelineArtifact@1
            displayName: Publish artifact "site"
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/site
              artifact: site

  - stage: Deploy
    displayName: Deploy to Azure Static Web Apps
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['DEPLOY_ENABLED'], 'true'))
    jobs:
      - deployment: deploy
        # Add approvals and checks to this environment in Pipelines > Environments.
        environment: production
        pool:
          vmImage: ubuntu-latest   # the Static Web Apps task needs a Linux agent with Docker
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: site
                - task: AzureStaticWebApp@0
                  displayName: Upload to Static Web Apps
                  inputs:
                    cwd: $(Pipeline.Workspace)/site
                    app_location: /
                    skip_app_build: true
                    azure_static_web_apps_api_token: $(SWA_DEPLOYMENT_TOKEN)
